services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${FTP_PORT:-2121}:${FTP_PORT:-2121}"
      - "${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30010}:${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30010}/tcp"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_BASE_PATH: /data/storage
      STORAGE_DISK_PATHS: ${STORAGE_DISK_PATHS:-/data/disks/ssd,/data/disks/hdd1,/data/disks/hdd2}
      STORAGE_DISK_LABELS: ${STORAGE_DISK_LABELS:-SSD,HDD 1,HDD 2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      PLUGINS_PATH: /plugins
      APP_PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      FTP_PORT: ${FTP_PORT:-2121}
      FTP_PASV_MIN: ${FTP_PASV_MIN:-30000}
      FTP_PASV_MAX: ${FTP_PASV_MAX:-30010}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-127.0.0.1}
    volumes:
      - ${STORAGE_BASE_PATH:-./data/storage}:/data/storage
      - ${DISK_SSD:-./data/disks/ssd}:/data/disks/ssd
      - ${DISK_HDD1:-./data/disks/hdd1}:/data/disks/hdd1
      - ${DISK_HDD2:-./data/disks/hdd2}:/data/disks/hdd2
      - ${PLUGINS_PATH:-./plugins}:/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
