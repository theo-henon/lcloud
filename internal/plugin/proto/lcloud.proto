syntax = "proto3";

package lcloud.plugin.v1;

option go_package = "github.com/theo-henon/lcloud/internal/plugin/proto;pluginproto";

service LcloudPlugin {
  rpc HandleEvent(EventRequest) returns (HandleResult);
}

service HostAPI {
  rpc Emit(EventRequest) returns (Empty);
  rpc Log(LogRequest) returns (Empty);
  rpc GetVolumeConfig(GetVolumeConfigRequest) returns (VolumeConfigView);
  rpc PluginDataDir(PluginDataDirRequest) returns (PluginDataDirResponse);
}

message EventRequest {
  string id = 1;
  string type = 2;
  string timestamp = 3;
  string volume_id = 4;
  bytes payload_json = 5;
}

message HandleResult {
  repeated EventRequest emit = 1;
}

message LogRequest {
  string plugin_id = 1;
  string volume_id = 2;
  string event_type = 3;
  string level = 4;
  string message = 5;
  bytes payload_json = 6;
}

message GetVolumeConfigRequest {
  string volume_id = 1;
}

message VolumeConfigView {
  string id = 1;
  string name = 2;
  int64 quota_bytes = 3;
  string filters_json = 4;
}

message PluginDataDirRequest {
  string volume_id = 1;
  string plugin_id = 2;
}

message PluginDataDirResponse {
  string path = 1;
}

message Empty {}
